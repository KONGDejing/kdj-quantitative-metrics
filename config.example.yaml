market: cn
poll_interval_seconds: 60
data_provider: akshare
web:
  host: 0.0.0.0
  port: 8010
  access: lan
symbols:
- code: '000300'
  name: 沪深300
timeframes:
- 1d
- 10m
kdj:
  n: 9
  m1: 3
  m2: 3
  upper: 80
  lower: 20
alert:
  cooldown_seconds: 600
  channels:
  - email
  - pushplus       # 微信推送（不需要可删除此行）
  force_notify_dates: []   # 全天监控日期列表，如 ["2026-07-31"]
  force_notify_symbols: [] # 仅对列表中的股票代码启用全天监控（空=全部），如 ["300394"]
pushplus:
  token: ''              # 单个 token，建议用环境变量 KDJ_PUSHPLUS_TOKEN 提供
  tokens: []             # 多个微信 token 可用 KDJ_PUSHPLUS_TOKENS=token1,token2 提供，不建议写进配置文件
email:
  provider: 163          # qq 或 163，发件邮箱二选一
  smtp_host: smtp.163.com
  smtp_port: 465
  username: your@163.com
  password: ''           # 授权码建议用环境变量 KDJ_EMAIL_PASSWORD 提供，不写死在配置文件
  from_addr: your@163.com
  to_addrs:
  - receiver@qq.com
