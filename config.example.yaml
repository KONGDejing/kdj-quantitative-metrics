market: cn
poll_interval_seconds: 60
quote_poll_interval_seconds: 15   # 实时报价独立轮询，不等待K线/研究任务
quote_max_age_seconds: 90         # 交易中超过此时效显示滞后；午间/收盘仅认可收尾快照
data_provider: akshare
market_calendar:
  fail_closed_unknown_year: true  # 未维护到新年份时停止定时交易任务，避免把休市日当交易日
  open_dates: []                  # 特殊开市覆盖，通常留空
  closed_dates: []                # 临时休市覆盖
use_llm_advice: false
llm:                              # 可选：确定性计划发送后做只读模型复核
  provider_order: [codex_cli, axera] # Codex登录态为主，现有Axera接口为备用
  codex:
    executable: codex
    model: gpt-5.6-sol
    reasoning_effort: medium
    https_proxy: ''               # 服务器需要代理时填写，如 http://127.0.0.1:10809
    timeout_seconds: 180
    retries: 2
    health_timeout_seconds: 60
    health_retries: 1
web:
  host: 0.0.0.0
  port: 8010
  access: lan
  require_write_token: true  # 公网/多人网络建议true；可信内网单人使用可设false
  default_symbol: '002179'
symbols:
- code: '000300'
  name: 沪深300
timeframes:
- 1d
- 10m
kdj:
  n: 9
  m1: 3
  m2: 3
  upper: 80
  lower: 20
kdj_alerts:
  enabled: true
  excluded_symbols: [] # 例：['000938']；仍展示KDJ，但不寻优、不发送KDJ买卖提醒
alert:
  cooldown_seconds: 600
  channels:
  - email
  - pushplus       # 微信推送（不需要可删除此行）
market_risk: # 暂定风险暂停线，未经过收益寻优；触发后当日不再新增，次日重新核验
  enabled: true
  index_drop_limits: {'000001': 0.02, '399006': 0.03}
  stock_drop_limit: 0.05
  max_quote_age_seconds: 180
observation_discipline: # 空仓候选的可执行信号纪律；系统不自动下单
  enabled: true
  entry_mode: stabilized_signal_only
  allow_preplanned_limit_orders: false # 旧的true设置也不再豁免止跌确认
  preplanned_limit_lots_per_symbol: 1
  forbid_raise_limit_price: true       # 盘中不得为了成交抬价追单
  earliest_entry_time: '14:45'
  latest_entry_time: '14:55'
  no_new_low_minutes: 30
  stabilization_rebound_ratio: 0.005 # 从当日低点至少回升0.5%
  max_bar_age_minutes: 10            # 5分钟线超时则不发信号
  total_capital_limit: 20000
  max_new_symbols_per_day: 1
  min_days_before_add: 5
price_alerts:      # 可选：到价后转入后台止跌观察，只在全条件通过后发买入信号
  '600584':
    name: 长电科技
    enabled: true
    target_price: 71
    minimum_price: 0           # 可选；大于0时只在[minimum_price, 目标价上限]内观察
    tolerance_ratio: 0.005     # 目标价上方0.5%内才允许继续判断，不单独提醒
    reset_ratio: 0.015         # 回到目标价上方1.5%才重新布防，避免反复推送
    lots: 1
    only_when_flat: true       # 已持仓时不再发“首次试仓”提醒
    max_quote_age_seconds: 180 # 超过3分钟的行情视为旧数据，不发送
    fee_per_lot: 5 # 小额成交（≤1.67万元）按每手5元；大额统一按成交额万分之三，历史明示fee不重算
    reason: 目标价附近首次试仓
    risk_note: 到价不等于止跌，单次仅1手
trade_plan:
  positions:
    '002179':
      opening:            # 必填：流水开始前最后一次确认的起始仓位
        as_of: '2026-01-01'
        core_lots: 5
        t_lots: 0
        cost_per_share: 34
      base_lots: 5       # 兼容汇总字段，由账本自动刷新
      cost: 34           # 扣除已实现收益后的保本成本，由账本自动刷新
      average_entry_cost: 34  # 当前持股的平均买入成本，由账本自动刷新
      target_sell: 40    # 底仓最终退出参考价
      final_exit_target: 40 # 到价后优先于反T，卖出全部可卖持仓且不再回补
      t_lots: 1          # 每档做T参考手数
      max_t_lots: 2      # 全天最多动用T仓手数
      base_lots_remaining: 5  # 当前剩余底仓手数
      t_lots_held: 0          # 当前T仓手数（当天买入后会累加）
      fee_per_lot: 5 # 小额成交默认值；大额成交使用万分之三
      strategy_mode: expand_base
      strategy_budget: 200000
      target_base_lots: 40
      next_stage_base_lots: 15
      max_t_lots: 10
      tactical_enabled: false  # 经过真实周期验证后才开启
      reverse_t:               # 盘中冲高后用可卖老仓做卖出后回补的反T
        enabled: true
        allocation_ratio: 0.30 # 当前固定3手反T额度；待补回手数逐手占用额度
        fixed_quota_lots: 3    # 10手持仓阶段固定最多动用3手老仓
        core_floor_lots: 7     # 始终至少保留7手底仓
        max_lots_per_trade: 2  # 每轮信号卖1或2手，绝不一次卖3手
        max_daily_cycles: 1    # 每个交易日最多完成/开启1轮
        trend_filter_enabled: false # 保留MA趋势代码但当前不参与执行；以后确认后再开启
        trend_ma_short: 20
        trend_ma_long: 60
        trend_slope_days: 5
        sell_spike_ratio: 0.020 # 较前收冲高约2.0%后才观察K值拐头
        intraday_k_high: 80
        buyback_gap_ratio: 0.015 # 按实际卖出价下方约1.5%盈利回补
        protective_buyback_enabled: false # 上涨时不高价追回，允许暂时少持1手
      shadow_tracking_enabled: true
      shadow_horizons: [5, 10, 20, 30, 60]
      max_signal_age_days: 4   # 正式日线过旧时不允许生成可执行买单
      max_deployed_ratio: 0.85
      max_daily_add_lots: 5
      max_oversold_cycle_add_lots: 10
      drawdown_pause: 0.10
      drawdown_review: 0.15
      drawdown_no_add: 0.20
      signal_rules:
        buy_k: 15
        rebound_k_max: 25
        sell_k: 80
        oversold_lookback: 3
        confirmation_min: 2
        max_first_tranche_lots: 2
        max_chase_ratio: 0.03
        atr_zone_fraction: 0.25
      fundamental_gate:
        status: caution  # pass / caution / block；unknown 会阻止扩仓
        checked_at: '2026-01-01'
        note: 定期报告结论待填写
      trade_history: []       # 权威成交事实；每笔可用 bucket=core/tactical 明确仓位类别
pushplus:
  token: ''              # 单个 token，建议用环境变量 KDJ_PUSHPLUS_TOKEN 提供
  tokens: []             # 多个微信 token 可用 KDJ_PUSHPLUS_TOKENS=token1,token2 提供，不建议写进配置文件
email:
  provider: 163          # qq 或 163，发件邮箱二选一
  smtp_host: smtp.163.com
  smtp_port: 465
  username: your@163.com
  password: ''           # 授权码建议用环境变量 KDJ_EMAIL_PASSWORD 提供，不写死在配置文件
  from_addr: your@163.com
  to_addrs:
  - receiver@qq.com
